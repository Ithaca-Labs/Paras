# Local stack: Postgres (+pgvector), one-shot migrations, and all apps.
# `docker compose up --build` then curl localhost:3000/v1/health
x-app: &app
  environment: &env
    DATABASE_URL: postgres://paras:paras@postgres:5432/paras
    LOG_LEVEL: ${LOG_LEVEL:-info}
  depends_on:
    migrate:
      condition: service_completed_successfully

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: paras
      POSTGRES_PASSWORD: paras
      POSTGRES_DB: paras
    ports: ['5432:5432']
    volumes: ['pgdata:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U paras']
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: builder
    command: pnpm --filter @paras/db migrate
    environment: *env
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    build: { context: ., dockerfile: apps/api/Dockerfile }
    ports: ['${API_PORT:-3000}:3000']
    environment:
      <<: *env
      API_PORT: 3000
      AUTH_SECRET: ${AUTH_SECRET:-dev-only-insecure-auth-secret-change-me}

  worker:
    <<: *app
    build: { context: ., dockerfile: apps/worker/Dockerfile }
    ports: ['${WORKER_PORT:-3001}:3001']
    environment:
      <<: *env
      WORKER_PORT: 3001

  mcp:
    build: { context: ., dockerfile: apps/mcp/Dockerfile }
    ports: ['${MCP_PORT:-3002}:3002']
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MCP_PORT: 3002
      API_URL: http://api:3000
    depends_on: [api]

  executor:
    build: { context: ., dockerfile: apps/executor/Dockerfile }
    ports: ['${EXECUTOR_PORT:-3003}:3003']
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      EXECUTOR_PORT: 3003

  # Envio HyperIndex (Vault events, Monad testnet). `docker compose --profile indexer up`.
  indexer-db:
    profiles: [indexer]
    image: postgres:17
    environment: { POSTGRES_USER: envio, POSTGRES_PASSWORD: envio, POSTGRES_DB: envio }
    volumes: ['indexerdata:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U envio']
      interval: 5s
      timeout: 5s
      retries: 10

  hasura:
    profiles: [indexer]
    image: hasura/graphql-engine:v2.43.0
    ports: ['8080:8080']
    environment:
      HASURA_GRAPHQL_DATABASE_URL: postgres://envio:envio@indexer-db:5432/envio
      HASURA_GRAPHQL_ENABLE_CONSOLE: 'true'
      HASURA_GRAPHQL_ADMIN_SECRET: ${HASURA_GRAPHQL_ADMIN_SECRET:-testing}
      HASURA_GRAPHQL_UNAUTHORIZED_ROLE: public
    depends_on:
      indexer-db: { condition: service_healthy }

  indexer:
    profiles: [indexer]
    image: node:22-slim
    working_dir: /app
    volumes: ['./indexer:/app']
    command: sh -c "corepack enable && pnpm install --ignore-workspace && pnpm codegen && pnpm start"
    environment:
      ENVIO_API_TOKEN: ${ENVIO_API_TOKEN:-}
      ENVIO_VAULT_ADDRESS: ${ENVIO_VAULT_ADDRESS:-0x0000000000000000000000000000000000000001}
      ENVIO_START_BLOCK: ${ENVIO_START_BLOCK:-0}
      ENVIO_PG_HOST: indexer-db
      ENVIO_PG_PORT: 5432
      ENVIO_PG_USER: envio
      ENVIO_PG_PASSWORD: envio
      ENVIO_PG_DATABASE: envio
      HASURA_GRAPHQL_ENDPOINT: http://hasura:8080/v1/metadata
      HASURA_GRAPHQL_ADMIN_SECRET: ${HASURA_GRAPHQL_ADMIN_SECRET:-testing}
    depends_on:
      indexer-db: { condition: service_healthy }
      hasura: { condition: service_started }

volumes:
  pgdata:
  indexerdata:
