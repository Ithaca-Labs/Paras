# Local stack: Postgres (+pgvector), one-shot migrations, and all apps.
# `docker compose up --build` then curl localhost:3000/v1/health
x-app: &app
  environment: &env
    DATABASE_URL: postgres://paras:paras@postgres:5432/paras
    LOG_LEVEL: ${LOG_LEVEL:-info}
  depends_on:
    migrate:
      condition: service_completed_successfully

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: paras
      POSTGRES_PASSWORD: paras
      POSTGRES_DB: paras
    ports: ['5432:5432']
    volumes: ['pgdata:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U paras']
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: builder
    command: pnpm --filter @paras/db migrate
    environment: *env
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    build: { context: ., dockerfile: apps/api/Dockerfile }
    ports: ['${API_PORT:-3000}:3000']
    environment:
      <<: *env
      API_PORT: 3000

  worker:
    <<: *app
    build: { context: ., dockerfile: apps/worker/Dockerfile }
    ports: ['${WORKER_PORT:-3001}:3001']
    environment:
      <<: *env
      WORKER_PORT: 3001

  mcp:
    build: { context: ., dockerfile: apps/mcp/Dockerfile }
    ports: ['${MCP_PORT:-3002}:3002']
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MCP_PORT: 3002
      API_URL: http://api:3000
    depends_on: [api]

  executor:
    build: { context: ., dockerfile: apps/executor/Dockerfile }
    ports: ['${EXECUTOR_PORT:-3003}:3003']
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      EXECUTOR_PORT: 3003

volumes:
  pgdata:
