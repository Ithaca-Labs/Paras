# Render Blueprint (#83): backend for the testnet demo. Web is on Vercel. Runbook: docs/DEPLOY.md
# `sync: false` values are prompted once on Blueprint creation.
databases:
  - name: paras-db
    plan: basic-256mb
    region: singapore
    postgresMajorVersion: '16'
    databaseName: paras
    user: paras

envVarGroups:
  - name: paras-chain
    envVars:
      - { key: VAULT_ADDRESS, value: '0x64BccF97c7e4EF197182E4665f3F99E6D72Bcba5' }
      - { key: VAULT_CHAIN_ID, value: '10143' }
      - { key: USDC_ADDRESS, value: '0x534b2f3A21130d7a60830c2Df862319e593943A3' }
      - { key: MONAD_RPC_URL, value: https://testnet-rpc.monad.xyz }
      - { key: EXECUTOR_DEMO_MODE, value: simulate }

services:
  - type: web
    name: paras-api
    runtime: docker
    plan: starter
    region: singapore
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /v1/health
    domains: [api.paraspredic.fun]
    buildFilter: { paths: [apps/api/**, packages/**, pnpm-lock.yaml] }
    envVars:
      - fromGroup: paras-chain
      - { key: DATABASE_URL, fromDatabase: { name: paras-db, property: connectionString } }
      - { key: PORT, value: '3000' }
      - { key: API_PORT, value: '3000' }
      - { key: AUTH_SECRET, generateValue: true }
      - { key: MAGIC_LINK_KEYS, sync: false }
      - { key: MAGIC_LINK_ACTIVE_KID, value: k1 }
      - { key: AUTH_DOMAIN, value: paraspredic.fun }
      - { key: WEB_BASE_URL, value: https://paraspredic.fun }
      - { key: OAUTH_ISSUER, value: https://api.paraspredic.fun }
      - { key: OAUTH_CONSENT_URL, value: https://paraspredic.fun/oauth/consent }
      - { key: EMAIL_PROVIDER, value: console }
      - { key: PRIVY_APP_ID, sync: false }
      - { key: PRIVY_APP_SECRET, sync: false }
      - { key: PRIVY_AUTHORIZATION_PRIVATE_KEY, sync: false }
      - { key: PRIVY_SIGNER_ID, sync: false }
      - { key: NEAR_INTENTS_API_KEY, sync: false }
      - { key: ADMIN_EMAILS, sync: false }

  - type: web
    name: paras-mcp
    runtime: docker
    plan: starter
    region: singapore
    dockerfilePath: ./apps/mcp/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    domains: [mcp.paraspredic.fun]
    buildFilter: { paths: [apps/mcp/**, packages/**, pnpm-lock.yaml] }
    envVars:
      - { key: PORT, value: '3002' }
      - { key: MCP_PORT, value: '3002' }
      # Private network: forwarded geo headers survive (Cloudflare would overwrite them).
      - { key: API_URL, value: 'http://paras-api:3000' }
      - { key: MCP_URL, value: https://mcp.paraspredic.fun }
      - { key: OAUTH_ISSUER, value: https://api.paraspredic.fun }

  - type: worker
    name: paras-worker
    runtime: docker
    plan: starter
    region: singapore
    dockerfilePath: ./apps/worker/Dockerfile
    dockerContext: .
    buildFilter: { paths: [apps/worker/**, packages/**, pnpm-lock.yaml] }
    envVars:
      - { key: DATABASE_URL, fromDatabase: { name: paras-db, property: connectionString } }
      - { key: EMAIL_PROVIDER, value: console }
      - { key: NANSEN_API_KEY, sync: false }

  - type: pserv
    name: paras-executor
    runtime: docker
    plan: starter
    region: singapore
    dockerfilePath: ./apps/executor/Dockerfile
    dockerContext: .
    buildFilter: { paths: [apps/executor/**, packages/**, pnpm-lock.yaml] }
    envVars:
      - fromGroup: paras-chain
      - { key: DATABASE_URL, fromDatabase: { name: paras-db, property: connectionString } }
      - { key: EXECUTOR_NETWORK, value: testnet }
      - { key: EXECUTOR_INTENTS_ENABLED, value: 'true' }
      - { key: EXECUTOR_PRIVATE_KEY, sync: false }
      - { key: EXECUTOR_MASTER_KEY, sync: false }
      - { key: MONAD_MESSAGE_TRANSMITTER, value: '0xA2258396A0a4F4f624f69f908919736245090CA0' }
      - { key: VAULT_START_BLOCK, value: '70795955' }
